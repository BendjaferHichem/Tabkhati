<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المفضلة — طبختي</title>
<meta name="description" content="الوصفات التي حفظتها في طبختي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a href="/" class="brand"><span class="brand__mark">🍳</span> طبختي</a>
    <nav class="site-nav">
      <a href="/">الرئيسية</a>
      <a href="discover.html">تصفح وصفات جديدة</a>
      <a href="favorites.html" class="active">المفضلة</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="hero" style="padding-top:28px;">
    <h1 style="font-size:1.6rem;">وصفاتك المفضلة ❤️</h1>
    <p>كل الوصفات التي حفظتها في مكان واحد.</p>
  </section>

  <section id="favoritesGridSection" hidden>
    <div class="discover-grid" id="favoritesGrid"></div>
  </section>

  <section id="emptyFavoritesSection" class="empty-state">
    <div class="emoji">🤍</div>
    <h3>لا توجد وصفات محفوظة بعد</h3>
    <p>اضغط على أيقونة القلب ♡ في أي وصفة لحفظها هنا.</p>
  </section>
</main>

<div class="modal-overlay" id="detailModal">
  <div class="modal-sheet" id="detailSheet" role="dialog" aria-modal="true"></div>
</div>

<div class="cooking-mode" id="cookingMode">
  <div class="cooking-header">
    <span id="cookingRecipeName" style="font-weight:700;"></span>
    <button class="modal-close" id="cookingClose" aria-label="إغلاق وضع الطبخ">✕</button>
  </div>
  <div class="progress-bar"><div class="progress-bar__fill" id="cookingProgress"></div></div>
  <div class="cooking-body">
    <div class="cooking-step-label" id="cookingStepLabel"></div>
    <div class="cooking-step-text" id="cookingStepText"></div>
  </div>
  <div class="cooking-footer">
    <button class="btn btn-secondary btn-block" id="cookingPrev">← السابق</button>
    <button class="btn btn-primary btn-block" id="cookingNext">التالي →</button>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<nav class="bottom-nav">
  <a href="/"><span class="icon">🏠</span>الرئيسية</a>
  <a href="discover.html"><span class="icon">🍽️</span>تصفح</a>
  <a href="favorites.html" class="active"><span class="icon">❤️</span>المفضلة</a>
</nav>

<script src="js/common.js"></script>
<script src="js/favorites.js"></script>
</body>
</html>
